# Task 1 architecture, trained end-to-end on Fakeddit (not just shape-checked).
model_name: scratch_bert
embed_dim: 512
num_heads: 8
num_layers: 2
max_len: 64
batch_size: 32
epochs: 6
lr: 1.0e-4
n_per_class: 2500
seed: 42

